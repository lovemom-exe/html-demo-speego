<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeeGo Logistics - Kiến trúc Component & Demo các trang</title>
  
  <!-- Favicon placeholder -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

  <!-- Google Fonts: Be Vietnam Pro & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Loading indicator & Error Card Styles */
    .app-loading-state {
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(242, 102, 28, 0.2);
      border-top-color: var(--orange-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .app-error-card {
      max-width: 640px;
      margin: 80px auto;
      background: #FFFFFF;
      border: 1px solid #FECACA;
      border-left: 6px solid #EF4444;
      border-radius: 10px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .app-error-title {
      color: #991B1B;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-error-desc {
      color: #4B5563;
      font-size: 0.92rem;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .app-error-cmd {
      background: #1E293B;
      color: #38BDF8;
      font-family: monospace;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin: 12px 0 20px 0;
      user-select: all;
    }

    .btn-retry {
      background: var(--navy-main);
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- PARTIAL HEADER CONTAINER -->
  <div id="header-container"></div>

  <!-- MAIN APP ROUTER CONTAINER -->

    <div class="app-loading-state">
      <div class="loading-spinner"></div>
      <div>Đang tải nội dung SpeeGo...</div>
    </div>
  </main>

      // 1b. DIRECT LANGUAGE COUNTERPARTS MAPPING (1-to-1 bilingual switching)

        '#/en/post/preparing-your-shipment': '#/knowledge/chuan-bi-lo-hang',

        '#/en/post/quality-control': '#/knowledge/kiem-soat-chat-luong'
      };

      // In-memory cache for loaded partials and pages
      const cache = {
        headerHtml: null,
        footerHtml: null,
        ctaFormHtml: null,
        pages: {}
      };

      let currentLang = 'vi';

      // 2. HELPER: FETCH WITH TRY/CATCH
      async function fetchText(url) {
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          return await response.text();
        } catch (err) {
          console.error(`Error loading resource [${url}]:`, err);
          throw err;
        }
      }

      // 3. LOAD & INITIALIZE SHARED PARTIALS
      async function loadPartials() {
        try {
          // Parallel fetch header, footer, and cta-form
          const [header, footer, ctaForm] = await Promise.all([
            fetchText('partials/header.html'),
            fetchText('partials/footer.html'),
            fetchText('partials/cta-form.html')
          ]);

          cache.headerHtml = header;
          cache.footerHtml = footer;
          cache.ctaFormHtml = ctaForm;

          // Inject into DOM
          const headerContainer = document.getElementById('header-container');
          const footerContainer = document.getElementById('footer-container');

          if (headerContainer) headerContainer.innerHTML = header;
          if (footerContainer) footerContainer.innerHTML = footer;

          // Parse CTA Form templates into memory
          parseCtaTemplates(ctaForm);

          // Bind header and footer global interactions
          bindHeaderInteractions();
          return true;
        } catch (err) {
          renderErrorScreen('Lỗi nạp component dùng chung (partials)', err);
          return false;
        }
      }

      // 4. PARSE CTA FORM TEMPLATES
      let ctaTemplates = {};
      function parseCtaTemplates(html) {
        const dummy = document.createElement('div');
        dummy.innerHTML = html;
        const tmplBand = dummy.querySelector('#tmpl-cta-band');
        const tmplSidebar = dummy.querySelector('#tmpl-cta-sidebar');
        ctaTemplates = {
          band: tmplBand ? tmplBand.innerHTML : '',
          sidebar: tmplSidebar ? tmplSidebar.innerHTML : ''
        };
      }

      // 4b. BILINGUAL DICTIONARY FOR CTA FORM & CONTACT
      const CTA_I18N = {
        vi: {
          tag: "LET'S MOVE FORWARD",
          defaultHeadingBand: 'Bắt đầu từ nhu cầu của bạn.',
          defaultHeadingSidebar: 'Bạn cần tư vấn?',
          defaultSubtext: 'Chia sẻ về hàng hóa và kế hoạch của doanh nghiệp. SpeeGo sẽ tư vấn giải pháp phù hợp.',
          phone: '(+84) 906 828 898 ↗',
          labelName: 'Họ và tên',
          placeholderName: 'Nguyễn Văn An',
          labelEmail: 'Email',
          placeholderEmail: 'ban@congty.com',
          labelPhone: 'Số điện thoại',
          placeholderPhone: 'Số điện thoại liên hệ',

          btnSubmit: 'Soạn email tư vấn ↗',
          securityNote: 'Mở ứng dụng email với nội dung đã điền. Thông tin chỉ được gửi đi khi bạn bấm Gửi trong email.'
        },
        en: {
          tag: "LET'S MOVE FORWARD",
          defaultHeadingBand: 'Start with what<br>you need.',
          defaultHeadingSidebar: 'Need expert advice?',
          defaultSubtext: 'Tell us about your products and business plans. SpeeGo will help you find the right solution.',
          phone: '(+84) 906 828 898 ↗',
          labelName: 'Full name',
          placeholderName: 'Your full name',
          labelEmail: 'Email',
          placeholderEmail: 'you@company.com',
          labelPhone: 'Phone number',
          placeholderPhone: 'Your contact number',
          labelMessage: 'How can we help?',
          placeholderMessage: 'Product type, quantity, origin, and destination...',
          btnSubmit: 'Draft an Inquiry ↗',
          securityNote: 'Opens your email app with a prepared message. Your information is only sent when you click Send in your email app.'
        }
      };

      // 4c. UPDATE SHELL (HEADER & FOOTER) LANGUAGE
      function updateShellLanguage(lang) {
        const isEn = (lang === 'en');
        document.documentElement.lang = isEn ? 'en' : 'vi';

        // 1. Header Logo
        const headerLogoLink = document.getElementById('headerLogoLink');
        if (headerLogoLink) {
          headerLogoLink.setAttribute('href', isEn ? '#/en/knowledge' : '#/knowledge');
        }

        // 2. Header Desktop Navigation
        const navItems = [
          { id: 'navLinkKnowledge', text: 'Knowledge', href: isEn ? '#/en/knowledge' : '#/knowledge' },
          { id: 'navLinkImportExport', text: isEn ? 'Import & Export' : 'Xuất nhập khẩu', href: isEn ? '#/en/import-export-news' : '#/knowledge/tin-xuat-nhap-khau' },
          { id: 'navLinkRoutes', text: isEn ? 'Shipping Routes' : 'Tuyến vận chuyển', href: isEn ? '#/en/trade-routes' : '#/knowledge/tuyen-thuong-mai' },
          { id: 'navLinkFulfillment', text: 'Fulfillment', href: isEn ? '#/en/fulfillment-warehouse' : '#/knowledge/fulfillment-kho-van' },

        ];
        navItems.forEach(item => {
          const el = document.getElementById(item.id);
          if (el) {
            el.textContent = item.text;
            el.setAttribute('href', item.href);
          }
        });

        // 3. Header Action Button
        const headerCtaBtn = document.getElementById('headerCtaBtn');
        if (headerCtaBtn) {
          headerCtaBtn.textContent = isEn ? 'Get in Touch ↗' : 'Nhận tư vấn ↗';
        }

        // 4. Lang switcher label
        const currentLangText = document.getElementById('currentLangText');
        if (currentLangText) {

        }

        // 5. Mobile Drawer Navigation
        const mobileNavItems = [
          { id: 'mNavLinkKnowledge', text: 'Knowledge', href: isEn ? '#/en/knowledge' : '#/knowledge' },

          { id: 'mNavLinkRoutes', text: isEn ? 'Shipping Routes' : 'Tuyến vận chuyển', href: isEn ? '#/en/trade-routes' : '#/knowledge/tuyen-thuong-mai' },

        }

        // 6. Footer Logo Link
        const footerLogoLink = document.getElementById('footerLogoLink');
        if (footerLogoLink) {
          footerLogoLink.setAttribute('href', isEn ? '#/en/knowledge' : '#/knowledge');
        }

        // 7. Footer Tagline
        const footerTagline = document.getElementById('footerTagline');
        if (footerTagline) {
          footerTagline.textContent = isEn
            ? 'Connecting suppliers in Vietnam & China with markets in the US, Canada, and Australia.'
            : 'Kết nối nguồn hàng Việt Nam & Trung Quốc với thị trường Mỹ, Canada và Úc.';
        }

        // 8. Footer Explore Column
        const footerExploreTitle = document.getElementById('footerExploreTitle');
        if (footerExploreTitle) {
          footerExploreTitle.textContent = isEn ? 'Explore' : 'Khám phá';

        const footerNavItems = [

          { id: 'footerLinkImportExport', text: isEn ? 'Import & Export' : 'Xuất nhập khẩu', href: isEn ? '#/en/import-export-news' : '#/knowledge/tin-xuat-nhap-khau' },

          { id: 'footerLinkFulfillment', text: 'Fulfillment', href: isEn ? '#/en/fulfillment-warehouse' : '#/knowledge/fulfillment-kho-van' },

        ];
        footerNavItems.forEach(item => {
          const el = document.getElementById(item.id);
          if (el) {

            el.setAttribute('href', item.href);
          }

        // 9. Footer Connect Column Title
        const footerConnectTitle = document.getElementById('footerConnectTitle');
        if (footerConnectTitle) {
          footerConnectTitle.textContent = isEn ? 'Connect with SpeeGo' : 'Kết nối với SpeeGo';
        }

        // 10. Footer Legal Link
        const footerLegalLink = document.getElementById('footerLegalLink');
        if (footerLegalLink) {
          footerLegalLink.textContent = isEn ? 'Our 8-step process ↗' : 'Quy trình 8 bước ↗';
        }
      }

      // 5. RENDER CTA FORM INSTANCES IN PAGE
      function renderCtaComponents(container) {
        const lang = currentLang || 'vi';
        const i18n = CTA_I18N[lang] || CTA_I18N.vi;

        const ctaPlaceholders = container.querySelectorAll('[data-component="cta-form"]');
        ctaPlaceholders.forEach(el => {
          const variant = el.getAttribute('data-variant') || 'band';
          const heading = el.getAttribute('data-heading') || (variant === 'band' ? i18n.defaultHeadingBand : i18n.defaultHeadingSidebar);
          const subtext = el.getAttribute('data-subtext') || i18n.defaultSubtext;
          const phone = el.getAttribute('data-phone') || i18n.phone;
          const tag = el.getAttribute('data-tag') || i18n.tag;

          let templateStr = ctaTemplates[variant] || ctaTemplates.band || '';
          if (templateStr) {
            const renderedHtml = templateStr
              .replace(/{{TAG}}/g, tag)
              .replace(/{{HEADING}}/g, heading)
              .replace(/{{SUBTEXT}}/g, subtext)
              .replace(/{{PHONE}}/g, phone)
              .replace(/{{LABEL_NAME}}/g, i18n.labelName)
              .replace(/{{PLACEHOLDER_NAME}}/g, i18n.placeholderName)
              .replace(/{{LABEL_EMAIL}}/g, i18n.labelEmail)
              .replace(/{{PLACEHOLDER_EMAIL}}/g, i18n.placeholderEmail)
              .replace(/{{LABEL_PHONE}}/g, i18n.labelPhone)
              .replace(/{{PLACEHOLDER_PHONE}}/g, i18n.placeholderPhone)
              .replace(/{{LABEL_MESSAGE}}/g, i18n.labelMessage)
              .replace(/{{PLACEHOLDER_MESSAGE}}/g, i18n.placeholderMessage)
              .replace(/{{BTN_SUBMIT}}/g, i18n.btnSubmit)
              .replace(/{{SECURITY_NOTE}}/g, i18n.securityNote);

            el.outerHTML = renderedHtml;
          }
        });
      }

      // 6. RENDER DYNAMIC BREADCRUMB
      function renderBreadcrumb(items) {
        const listEl = document.getElementById('breadcrumbList');
        if (!listEl) return;

        if (!items || !items.length) {
          listEl.innerHTML = '';
          return;
        }

        let html = '';
        items.forEach((item, index) => {
          const isLast = index === items.length - 1;
          if (isLast) {
            html += `<span class="breadcrumb-current">${item.label}</span>`;
          } else {
            html += `<a href="${item.href}" class="breadcrumb-link">${item.label}</a>`;
            html += `<span class="breadcrumb-sep">/</span>`;
          }
        });

        listEl.innerHTML = html;
      }

      // 7. UPDATE ACTIVE NAVIGATION HIGHLIGHTS
      function updateNavHighlights(activeNavKey) {
        // Desktop nav
        document.querySelectorAll('#headerNavMenu .nav-item').forEach(item => {
          if (item.getAttribute('data-nav') === activeNavKey) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });

        // Mobile drawer links
        document.querySelectorAll('#mobileDrawerLinks .drawer-link').forEach(link => {
          if (link.getAttribute('data-nav') === activeNavKey) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }

      // 8. BIND HEADER INTERACTIONS (Mobile Drawer & Language Switcher)
      function bindHeaderInteractions() {
        const openBtn = document.getElementById('mobileMenuOpen');
        const closeBtn = document.getElementById('mobileMenuClose');
        const drawer = document.getElementById('mobileDrawer');
        const backdrop = document.getElementById('drawerBackdrop');

        function openDrawer() {
          if (drawer) drawer.classList.add('open');
          if (backdrop) backdrop.classList.add('open');
          document.body.style.overflow = 'hidden';
        }

        function closeDrawer() {
          if (drawer) drawer.classList.remove('open');
          if (backdrop) backdrop.classList.remove('open');
          document.body.style.overflow = '';
        }

        if (openBtn) openBtn.onclick = openDrawer;
        if (closeBtn) closeBtn.onclick = closeDrawer;
        if (backdrop) backdrop.onclick = closeDrawer;

        // Auto close drawer when clicking any link inside
        document.querySelectorAll('#mobileDrawerLinks a').forEach(a => {
          a.addEventListener('click', closeDrawer);
        });

        // Smooth scroll for consultation CTA buttons without altering SPA hash
        document.addEventListener('click', function (e) {
          const ctaLink = e.target.closest('a[href="#contact-form"]');
          if (ctaLink) {
            e.preventDefault();
            const contactForm = document.getElementById('contact-form');
            if (contactForm) {
              contactForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }
        });

        // Language toggle
        const langToggle = document.getElementById('langToggle');
        if (langToggle) {
          langToggle.onclick = () => {
            const hash = window.location.hash || '#/knowledge';
            if (LANG_PAIRS[hash]) {
              window.location.hash = LANG_PAIRS[hash];
            } else if (currentLang === 'vi') {
              window.location.hash = '#/en/knowledge';
            } else {
              window.location.hash = '#/knowledge';
            }
          };
        }
      }

      // 9. BIND PAGE INTERACTIONS (Accordion FAQ, Pills, Smooth Scroll)
      function bindPageInteractions() {
        // FAQ Accordions
        const faqItems = document.querySelectorAll('.faq-item');
        faqItems.forEach(item => {
          const btn = item.querySelector('.faq-question-btn');
          if (btn) {
            btn.onclick = () => {
              const isActive = item.classList.contains('active');
              faqItems.forEach(other => {
                if (other !== item) other.classList.remove('active');
              });
              if (isActive) {
                item.classList.remove('active');
              } else {
                item.classList.add('active');
              }
            };
          }
        });

        // Pill filters in Shipping Guide explore section
        const pills = document.querySelectorAll('.pills-filter-row .pill-btn');
        pills.forEach(pill => {
          pill.addEventListener('click', function (e) {
            // If it has href starting with #/, router handles navigation
            pills.forEach(p => p.classList.remove('active'));
            this.classList.add('active');
          });
        });
      }

      // 10. ERROR SCREEN DISPLAY
      function renderErrorScreen(title, err) {
        const appMain = document.getElementById('app-main');
        if (!appMain) return;

        appMain.innerHTML = `
          <div class="container">
            <div class="app-error-card">
              <div class="app-error-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                ${title}
              </div>
              <p class="app-error-desc">
                Trình duyệt đã chặn truy cập file cục bộ qua <code>fetch()</code> khi mở trực tiếp file HTML (giao thức <code>file:///</code>). 
                Để xem trang đầy đủ với kiến trúc partials động, vui lòng chạy website qua một web server cục bộ:
              </p>
              <div class="app-error-cmd">
                npx serve .<br>
                # hoặc chạy bằng Python:<br>
                python -m http.server 8080
              </div>
              <p class="app-error-desc" style="font-size: 0.84rem; color: #6B7280;">
                Chi tiết kỹ thuật: ${err ? err.message : 'Unknown error'}
              </p>
              <button class="btn-retry" onclick="window.location.reload()">
                Thử lại ↻
              </button>
            </div>
          </div>
        `;
      }

      // 11. ROUTE DISPATCHER
      async function router() {
        let hash = window.location.hash;
        
        // Normalize empty or root hashes to default route
        if (!hash || hash === '#' || hash === '#/') {
          window.location.hash = '#/knowledge';
          return;
        }

        // Support alias: #/knowledge1 -> #/knowledge
        if (hash === '#/knowledge1' || hash === '#knowledge') {
          window.location.hash = '#/knowledge';
          return;
        }

        const route = ROUTES[hash] || ROUTES['#/knowledge'];
        currentLang = route.lang || 'vi';

        // Update document title
        if (route.title) {
          document.title = route.title;
        }

        // Update Shell / Wrapper components for current language
        updateShellLanguage(currentLang);

        const appMain = document.getElementById('app-main');
        if (!appMain) return;

        // Show loading state
        appMain.innerHTML = `
          <div class="app-loading-state">
            <div class="loading-spinner"></div>
            <div>${currentLang === 'en' ? 'Loading page...' : 'Đang tải trang...'}</div>
          </div>
        `;

        try {
          // Fetch or get from cache
          let pageHtml = cache.pages[route.file];
          if (!pageHtml) {
            pageHtml = await fetchText(route.file);
            cache.pages[route.file] = pageHtml;
          }

          // Inject into main
          appMain.innerHTML = pageHtml;

          // Parse page-level metadata
          const pageContainer = appMain.querySelector('.page-container');
          let breadcrumbs = [];
          let navKey = route.nav;

          if (pageContainer) {
            const rawBreadcrumbs = pageContainer.getAttribute('data-breadcrumb');
            if (rawBreadcrumbs) {
              try {
                breadcrumbs = JSON.parse(rawBreadcrumbs);
              } catch (e) {
                console.error('Invalid breadcrumb JSON:', e);
              }
            }
            const pageNav = pageContainer.getAttribute('data-nav');
            if (pageNav) navKey = pageNav;
          }

          // Update breadcrumbs and active nav menu
          renderBreadcrumb(breadcrumbs);
          updateNavHighlights(navKey);

          // Render any nested CTA Form components
          renderCtaComponents(appMain);

          // Re-bind interactive events (FAQ accordion, pills)
          bindPageInteractions();

          // Scroll to top
          window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (err) {
          renderErrorScreen(`Không thể tải trang [${route.file}]`, err);
        }
      }

      // 12. INITIALIZATION
      async function init() {
        const partialsLoaded = await loadPartials();
        if (partialsLoaded) {
          window.addEventListener('hashchange', router);
          router();
        }
      }

      // Run on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();

    // 13. GLOBAL CONSULTATION FORM SUBMIT HANDLER (Toast Simulation)
    let toastTimeout;
    function handleConsultSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const nameInput = form.querySelector('input[type="text"]');
      const isEn = (document.documentElement.lang === 'en');
      const fallbackName = isEn ? 'there' : 'Quý khách';
      const name = nameInput ? (nameInput.value.trim() || fallbackName) : fallbackName;

      const toastPopup = document.getElementById('toastPopup');
      const toastText = document.getElementById('toastText');

      if (toastText) {
        toastText.textContent = isEn
          ? `Thank you ${name}! SpeeGo has received your inquiry and will contact you shortly.`
          : `Cảm ơn ${name}! SpeeGo đã tiếp nhận yêu cầu và sẽ liên hệ lại trong vòng 2 giờ.`;
      }

      if (toastPopup) {
        toastPopup.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastPopup.classList.remove('show');
        }, 4500);
      }

      form.reset();
    }
  </script>
</body>
</html>
